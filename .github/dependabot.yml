version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # One PR per week for all action bumps instead of one PR per action.
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Dev tooling moves together (eslint + @eslint/js must match majors),
    # so group it into a single weekly PR.
    groups:
      dev-dependencies:
        dependency-type: development
